name: Preview Deployment

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Course media is committed to public/media/ (so `npm run dev` serves it),
  # uploaded here to the cfdev-school-media R2 bucket at the same path, and
  # removed from the branch so it never reaches main. src/pages/media/[...path].ts
  # redirects /media/* to media.cfdev.school once the files are gone.
  # Only branches in this repo get the R2 secrets, not forks.
  upload-media:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Upload public/media to R2 and remove it from the branch
        if: hashFiles('public/media/**') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          echo "## Uploaded to media.cfdev.school" >> "$GITHUB_STEP_SUMMARY"
          cd public/media
          find . -type f ! -name .DS_Store -print0 | while IFS= read -r -d '' file; do
            key="${file#./}"
            case "$key" in
              *.vtt) type=text/vtt ;;
              *) type=$(file --brief --mime-type "$file") ;;
            esac
            aws s3 cp "$file" "s3://cfdev-school-media/$key" --content-type "$type" --endpoint-url "$R2_ENDPOINT" --only-show-errors
            echo "- https://media.cfdev.school/$key" >> "$GITHUB_STEP_SUMMARY"
          done
          cd "$GITHUB_WORKSPACE"
          git rm -r --quiet public/media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "chore: move public/media to media.cfdev.school"
          git push --quiet

  deploy-preview:
    needs: upload-media
    # Run even when upload-media is skipped (forks), but not when it failed.
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.upload-media.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      # Last checked 2026-09-09: actions/checkout@v7.0.1, actions/setup-node@v7.0.0
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      # upload-media has put these in R2 and removed them from the branch, but
      # this checkout is the commit before that. Leave them out so the preview
      # redirects /media/* to R2 like production does.
      - run: rm -rf public/media

      - run: npm run preview:deploy
        env:
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  destroy-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      # Last checked 2026-09-09: actions/checkout@v7.0.1, actions/setup-node@v7.0.0
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run preview:destroy
        env:
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
