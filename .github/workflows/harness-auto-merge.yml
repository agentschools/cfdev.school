name: Harness native auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: harness-data-publication
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository_id == '1264727819' && github.event.workflow_run.head_branch == 'chore/refresh-harnesses'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run executes the default branch's workflow. Never check out PR code.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: node scripts/harness-refresh.mjs check
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_AUTO_MERGE_ENABLED: ${{ vars.HARNESS_AUTO_MERGE_ENABLED }}
          HARNESS_APP_ID: ${{ vars.HARNESS_APP_ID }}
          HARNESS_APP_BOT_ID: ${{ vars.HARNESS_APP_BOT_ID }}
          HARNESS_APP_BOT_LOGIN: ${{ vars.HARNESS_APP_BOT_LOGIN }}

  arm:
    needs: qualify
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: harness-publisher
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: agentschools
          repositories: cloudflare-dev-school
          permission-contents: write
          permission-pull-requests: write
      # Re-read every gate after obtaining the token; the mutation matches the head atomically.
      - run: node scripts/harness-refresh.mjs enable
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          HARNESS_AUTO_MERGE_ENABLED: ${{ vars.HARNESS_AUTO_MERGE_ENABLED }}
          HARNESS_APP_ID: ${{ vars.HARNESS_APP_ID }}
          HARNESS_APP_BOT_ID: ${{ vars.HARNESS_APP_BOT_ID }}
          HARNESS_APP_BOT_LOGIN: ${{ vars.HARNESS_APP_BOT_LOGIN }}
