name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Last checked 2026-09-09: actions/checkout@v7.0.1, actions/setup-node@v7.0.0
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run lint

      # Media belongs in public/media/, which preview.yml moves to R2.
      - name: Keep large files out of git
        run: |
          large=$(git ls-files -z -- . ':(exclude)public/media' | xargs -0 -r stat -c '%s %n' | awk '$1 > 1048576')
          if [ -n "$large" ]; then
            echo "::error::Files over 1 MB. Put media in public/media/ instead, see AGENTS.md:"
            echo "$large"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Last checked 2026-09-09: actions/checkout@v7.0.1, actions/setup-node@v7.0.0
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run test
