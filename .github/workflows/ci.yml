name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Last checked 2026-09-09: actions/checkout@v7.0.1, actions/setup-node@v7.0.0
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Last checked 2026-09-09: actions/checkout@v7.0.1, actions/setup-node@v7.0.0
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run test

  # Main's required policy context must also be satisfied for ordinary PRs.
  # Reserve it on the generator branch for the trusted workflow_run gate.
  harness-policy:
    name: ${{ github.head_ref == 'chore/refresh-harnesses' && 'harness-policy-reserved' || 'harness-policy' }}
    if: github.head_ref != 'chore/refresh-harnesses'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Ordinary PR; normal required checks and review rules apply.'
